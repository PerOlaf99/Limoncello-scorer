[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limoncello-scorer"
version = "0.3.0"
description = "Viewer, base caller, genotyping peak picker and scorer for capillary-electrophoresis traces"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PerOlaf99", email = "poekstrom99@gmail.com" }]
keywords = ["capillary electrophoresis", "base calling", "genotyping", "Sanger", "MegaBACE", "RSD", "fragment sizing", "ladder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Runtime core: the base caller and the scorer only need numpy/scipy.
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[project.optional-dependencies]
# Desktop viewer (the GUI needs tkinter from the system Python + matplotlib).
gui = ["matplotlib>=3.5", "pillow>=9"]
# Optional file formats.
xlsx = ["openpyxl>=3.0"]
scf = ["biopython>=1.79"]
all = ["matplotlib>=3.5", "pillow>=9", "openpyxl>=3.0", "biopython>=1.79"]

[project.urls]
Homepage = "https://github.com/PerOlaf99/Limoncello-scorer"

[project.scripts]
limoncello = "sequence_analyzer:main"
limoncello-scorer = "scorer:main"
limoncello-basecall = "basecall:main"

[tool.setuptools]
# Flat layout: the app modules live at the repository root.
py-modules = ["analyzer_core", "fragment_sizing", "genotyping", "scorer", "sequence_analyzer", "configs", "basecall"]

[tool.setuptools.packages.find]
include = ["cimarron_basecaller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
